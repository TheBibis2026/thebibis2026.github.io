body::before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:screen;
 background-image:radial-gradient(circle at 15% 24%,rgba(255,225,154,.55) 0 1px,transparent 1.7px),radial-gradient(circle at 72% 62%,rgba(212,184,120,.42) 0 1px,transparent 1.8px);
 background-size:38px 38px,53px 53px;animation:goldDrift 16s linear infinite;
}
.card{
 position:relative;width:min(450px,100%);padding:38px 30px 30px;text-align:center;color:white;
 border:1px solid rgba(212,184,120,.58);border-radius:34px;
 background:linear-gradient(145deg,rgba(35,22,13,.28),rgba(10,7,5,.18));
 box-shadow:0 28px 90px rgba(0,0,0,.44),inset 0 0 0 1px rgba(255,255,255,.07);
 backdrop-filter:blur(14px) saturate(115%);-webkit-backdrop-filter:blur(14px) saturate(115%);
 animation:cardIn .9s cubic-bezier(.2,.8,.2,1) both;
}
.card::before,.card::after{content:"";position:absolute;pointer-events:none;border-radius:26px}
.card::before{inset:9px;border:1px solid rgba(243,223,174,.20)}
.card::after{inset:0;background:linear-gradient(115deg,transparent 22%,rgba(255,226,157,.06) 43%,transparent 64%);background-size:230% 100%;animation:shimmer 8s ease-in-out infinite}
h1{
 position:relative;z-index:1;margin:0 0 28px;color:#fff;font-family:Italianno,cursive;
 font-size:clamp(72px,19vw,100px);font-weight:400;line-height:.84;
 text-shadow:0 4px 26px rgba(0,0,0,.58),0 0 22px rgba(212,184,120,.16);
 animation:titleFloat 5s ease-in-out infinite;
}
.name-field{position:relative;z-index:2;margin:2px 8px 24px}
.name-field input{
 width:100%;height:46px;padding:4px 3px 8px;border:0;border-bottom:1px solid rgba(243,223,174,.72);
 border-radius:0;background:transparent;color:#fff;text-align:center;font:500 16px Montserrat,Arial,sans-serif;
 outline:none;box-shadow:none;transition:border-color .3s,filter .3s;
}
.name-field input::placeholder{color:rgba(255,255,255,.76);font-weight:400}
.name-field input:focus{border-bottom-color:var(--gold-light);filter:drop-shadow(0 5px 8px rgba(212,184,120,.2))}
.name-field::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:var(--gold-light);transform:translateX(-50%);transition:width .35s ease}
.name-field:focus-within::after{width:100%}
.actions{position:relative;z-index:2;display:grid;gap:12px}
button{
 width:100%;box-sizing:border-box;min-height:56px;border-radius:999px;padding:12px 18px;
 font:600 14px Montserrat,Arial,sans-serif;letter-spacing:.02em;cursor:pointer;
 transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(0) scale(.99)}
.camera{border:1px solid rgba(255,255,255,.70);background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(246,237,220,.95));color:#362619;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.gallery{border:1px solid rgba(212,184,120,.62);background:rgba(22,14,9,.27);color:#fff;box-shadow:inset 0 0 18px rgba(212,184,120,.04)}
.upload{border:1px solid rgba(255,238,196,.55);background:linear-gradient(135deg,#e0c88d,#D4B878 52%,#b89455);color:#2a1c11;box-shadow:0 10px 28px rgba(212,184,120,.28);margin-top:2px}
.icon{vertical-align:-4px;margin-right:9px}
.preview{position:relative;z-index:2;display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin:16px 0 3px}
.preview img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:1px solid rgba(212,184,120,.55);box-shadow:0 6px 16px rgba(0,0,0,.22)}
.status{position:relative;z-index:2;display:none;margin-top:14px;color:rgba(255,255,255,.9);font-size:12px;letter-spacing:.05em}
input[type=file]{display:none}button:disabled{cursor:not-allowed;opacity:.56;transform:none!important}.upload-overlay{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;padding:24px;background:rgba(15,9,5,.72);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}.upload-overlay.visible{display:flex}.progress-panel{width:min(360px,100%);padding:30px 26px;text-align:center;border:1px solid rgba(212,184,120,.55);border-radius:28px;background:rgba(30,19,11,.78);box-shadow:0 25px 80px rgba(0,0,0,.45)}.spinner{width:52px;height:52px;margin:0 auto 20px;border:3px solid rgba(255,255,255,.16);border-top-color:#D4B878;border-radius:50%;animation:spin .85s linear infinite}.progress-title{font-size:13px;font-weight:600;letter-spacing:.12em}.progress-count{margin-top:9px;color:rgba(255,255,255,.78);font-size:14px}.progress-track{height:11px;margin-top:20px;overflow:hidden;border:1px solid rgba(212,184,120,.28);border-radius:999px;background:rgba(255,255,255,.10)}.progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#b89455,#D4B878,#f3dfae);transition:width .35s ease}.progress-percent{margin-top:10px;color:#f3dfae;font-size:14px;font-weight:600}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shimmer{0%,35%{background-position:210% 0}70%,100%{background-position:-110% 0}}
@keyframes goldDrift{from{transform:translateY(0)}to{transform:translateY(38px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:390px){body{padding:14px}.card{padding:32px 20px 24px;border-radius:28px}h1{font-size:76px}}
</style>
</head>
<body>
<main class="card">
  <h1>Agnese &amp; Lorenzo</h1>
  <div class="name-field"><input id="name" type="text" autocomplete="name" placeholder="Il tuo nome (facoltativo)"></div>
  <div class="actions">
    <button class="camera" type="button" onclick="cameraInput.click()"><svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 5L9.5 3h5L16 5h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="1.8"/></svg>Scatta una foto</button>
    <button class="gallery" type="button" onclick="galleryInput.click()"><svg class="icon" width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9" r="1.5" stroke="currentColor" stroke-width="1.6"/><path d="m5 18 4.5-4.5 3 3 2.5-2.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Scegli foto</button>
    <input id="cameraInput" type="file" accept="image/*" capture="environment">
    <input id="galleryInput" type="file" accept="image/*" multiple>
    <div id="preview" class="preview"></div>
    <button class="upload" type="button" onclick="uploadPhotos()">Carica foto</button>
  </div>
  <div id="status" class="status"></div>
</main>
<div id="uploadOverlay" class="upload-overlay" role="status" aria-live="polite" aria-busy="true">
  <div class="progress-panel">
    <div class="spinner" aria-hidden="true"></div>
    <div class="progress-title">CARICAMENTO FOTO</div>
    <div id="progressCount" class="progress-count">Foto 0 di 0</div>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
    <div id="progressPercent" class="progress-percent">0%</div>
  </div>
</div>
<script>
const UPLOAD_URL="https://script.google.com/macros/s/AKfycby5mK85tUTdU8jV-c5SJGIbCK7UjGpt7YpAczsFd1vloESAZ1nFlFgy_RmzV552tOGJ/exec";
let selected=[];
let uploading=false;
const cameraInput=document.getElementById('cameraInput');
const galleryInput=document.getElementById('galleryInput');
const preview=document.getElementById('preview');
const statusBox=document.getElementById('status');
cameraInput.addEventListener('change',()=>add(cameraInput.files));
galleryInput.addEventListener('change',()=>add(galleryInput.files));
function add(files){if(uploading)return;selected.push(...Array.from(files));render();}
function render(){
  preview.innerHTML='';
  preview.style.display=selected.length?'grid':'none';
  selected.slice(-8).forEach(file=>{const img=document.createElement('img');const url=URL.createObjectURL(file);img.src=url;img.onload=()=>URL.revokeObjectURL(url);preview.appendChild(img);});
  statusBox.style.display=selected.length?'block':'none';
  statusBox.textContent=selected.length+' '+(selected.length===1?'foto selezionata':'foto selezionate');
}
function fileToPayload(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,mimeType:file.type||"application/octet-stream",data:String(reader.result).split(",")[1]});
    reader.onerror=()=>reject(new Error("Impossibile leggere "+file.name));
    reader.readAsDataURL(file);
  });
}
function setProgress(completed,total){
  const percent=total?Math.round((completed/total)*100):0;
  document.getElementById("progressCount").textContent="Foto "+completed+" di "+total;
  document.getElementById("progressFill").style.width=percent+"%";
  document.getElementById("progressPercent").textContent=percent+"%";
}
function setLocked(locked){
  uploading=locked;
  document.getElementById("uploadOverlay").classList.toggle("visible",locked);
  document.querySelectorAll("button,input").forEach(el=>el.disabled=locked);
  document.body.style.overflow=locked?"hidden":"";
}
async function uploadPhotos(){
  if(uploading)return;
  if(!selected.length){alert("Scatta o seleziona almeno una foto");return;}
  const uploader=document.getElementById("name").value.trim()||"Anonimo";
  const queue=[...selected];
  setProgress(0,queue.length);
  setLocked(true);
  try{
    for(let i=0;i<queue.length;i++){
      const payload=await fileToPayload(queue[i]);
      const response=await fetch(UPLOAD_URL,{
        method:"POST",
        body:JSON.stringify({name:uploader,files:[payload]})
      });
      if(!response.ok)throw new Error("Upload fallito per "+queue[i].name);
      setProgress(i+1,queue.length);
    }
    selected=[];
    preview.innerHTML="";
    preview.style.display="none";
    cameraInput.value="";
    galleryInput.value="";
    statusBox.style.display="block";
    statusBox.textContent="Grazie! "+queue.length+" "+(queue.length===1?"foto è stata inviata.":"foto sono state inviate.");
  }catch(error){
    statusBox.style.display="block";
    statusBox.textContent="Caricamento interrotto. Riprova le foto non completate.";
    alert(error.message||"Errore durante il caricamento");
  }finally{
    setLocked(false);
  }
}
</script>
</body>
</html>
