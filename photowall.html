  if(now-quietSince<IDLE_OVERLAY_INTERVAL_MS)return;
  const candidate=pickIdleItem();if(!candidate)return;
  const prepared=await prepare([candidate]);
  if(!prepared.length){lastOverlayEndedAt=Date.now();return;}
  rememberIdle(prepared[0]);
  enqueueArrivals(prepared);
}
async function processArrivalQueue(){
  if(arrivalPlaying)return;
  arrivalPlaying=true;
  try{
    while(arrivalQueue.length){
      const item=arrivalQueue.shift();
      await playArrival(item);
      if(arrivalQueue.length)await delay(OVERLAY_GAP_MS);
    }
  }finally{arrivalActiveId=null;arrivalPlaying=false;lastOverlayEndedAt=Date.now()}
}
function enqueueArrivals(items){
  const queuedIds=new Set(arrivalQueue.map(extractId));
  const additions=[];
  for(const item of items){
    const id=extractId(item);
    if(!id||id===arrivalActiveId||queuedIds.has(id))continue;
    queuedIds.add(id);additions.push(item);
  }
  arrivalQueue.push(...additions);
  // Keep the newest pending items when simultaneous arrivals exceed the queue cap.
  if(arrivalQueue.length>MAX_OVERLAY_QUEUE){
    arrivalQueue=arrivalQueue
      .sort((a,b)=>new Date(b.updated||b.created||0)-new Date(a.updated||a.created||0))
      .slice(0,MAX_OVERLAY_QUEUE);
  }
  processArrivalQueue();
}
function showToast(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}
function updateStatus(){setStatus(media.length+' elementi · scorrimento continuo · idle overlay 5s'+(arrivalQueue.length?' · coda '+arrivalQueue.length+'/'+MAX_OVERLAY_QUEUE:'')+(skippedVideos?' · '+skippedVideos+' video ignorati':''))}
async function fetchMedia(){try{const r=await fetch(API+'?action=list&token='+encodeURIComponent(TOKEN)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();if(!data.success)throw new Error(data.message||'Risposta non valida');const next=data.files||[],ids=new Set(next.map(extractId));newIds=previousIds.size?new Set([...ids].filter(id=>!previousIds.has(id))):new Set();const arrivals=initialLoad?[]:next.filter(item=>newIds.has(extractId(item)));if(newIds.size)showToast();previousIds=ids;media=next;initialLoad=false;if(arrivals.length){lastNewArrivalAt=Date.now();const prepared=await prepare(arrivals);enqueueArrivals(prepared)}updateStatus();setTimeout(()=>newIds.clear(),12000)}catch(e){setStatus('Errore: '+e.message)}}
